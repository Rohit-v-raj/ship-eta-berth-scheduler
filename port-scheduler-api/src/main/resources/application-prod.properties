# Production settings, used with --spring.profiles.active=prod.

# Log lines as JSON in the Elastic Common Schema (ECS), one object per line on
# standard output, for a log collector to read. The request id is a field of
# each line (requestId), and line breaks inside values are escaped, so text
# that comes from outside cannot fake a log line.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=port-scheduler-api
