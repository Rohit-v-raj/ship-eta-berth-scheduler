spring.application.name=port-scheduler-api
server.port=8080

# Base URL of the Python FastAPI ETA model service (Phase 2)
eta.api.url=http://localhost:8000

# Secrets (Gemini API key, DB password) stay out of version control.
# Copy secrets.properties.example to secrets.properties and fill it in.
spring.config.import=optional:file:./secrets.properties

# Gemini model used by the harbor-master agent
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.2

# MySQL — schema is owned by Flyway; Hibernate only validates against it
spring.datasource.url=jdbc:mysql://localhost:3306/port_core
spring.datasource.username=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Timestamps are stored as UTC regardless of the server's time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Berth planning: a queued vessel's requested arrival is re-issued only when it moves by at least this much
port.planning.reissue-threshold-minutes=15
# A vessel is expected to accept a requested arrival within this long; after that the console flags it
port.planning.answer-window-minutes=60
# A booked vessel whose estimate is more than this after its agreed arrival gives its berth up to a waiting
# vessel that can be alongside sooner; a waiting vessel this much later than another is skipped for it
port.planning.late-tolerance-minutes=240
# A fresh estimate is expected from each vessel this many hours before its arrival
port.planning.estimate-milestones-hours=72,48,24

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
