# Persistence tests run against a throwaway schema on the local MySQL, never
# port_core. The schema is wiped and rebuilt from the migrations on every run
# (see CleanMigrateConfig), which is why clean has to be allowed here.
spring.datasource.url=jdbc:mysql://localhost:3306/port_core_test?createDatabaseIfNotExist=true
spring.flyway.clean-disabled=false
